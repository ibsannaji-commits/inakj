<!DOCTYPE html>
<html lang="om" data-lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Login – INA-KJ Agro Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #E8F5E9 0%, #F7F9F8 40%, #fff 100%);
    }
    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #1B7A3D, #145C2E);
      color: white;
      padding: 28px 28px 24px;
      text-align: center;
    }
    .auth-header .logo-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
    }
    .auth-header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .auth-header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .auth-body {
      padding: 28px;
    }
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-size: 0.95rem;
    }
    .form-group input:focus {
      border-color: var(--primary);
      background: white;
      outline: none;
      box-shadow: 0 0 0 3px rgba(27,122,61,0.1);
    }
    .form-row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .form-row-between label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .form-row-between input {
      accent-color: var(--primary);
    }
    .form-row-between a {
      color: var(--primary);
      font-weight: 600;
    }
    .form-row-between a:hover {
      text-decoration: underline;
    }
    .btn-auth {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.2s;
    }
    .btn-auth:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--primary);
      font-weight: 700;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .switch-role {
      text-align: center;
      padding: 16px 28px;
      border-top: 1px solid var(--border-light);
      background: var(--bg);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .switch-role a {
      color: var(--primary);
      font-weight: 600;
      margin: 0 4px;
    }
    .lang-top {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .back-home {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
    }
    .back-home:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-home">← Home</a>
  <div class="lang-top">
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="om">OM</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon">IK</div>
        <h1>INA-KJ Agro Connect</h1>
        <p>
          <span class="lang-om">Qonnaan Bulaa Login</span>
          <span class="lang-en">Farmer Login</span>
        </p>
      </div>
      <div class="auth-body">
        <div class="role-badge">
          👨‍🌾
          <span class="lang-om">Qonnaan / Seller</span>
          <span class="lang-en">Farmer / Seller</span>
        </div>

        <form onsubmit="return handleLogin(event)">
          <div class="form-group">
            <label>
              <span class="lang-om">Bilbila ykn Email</span>
              <span class="lang-en">Phone or Email</span>
            </label>
            <input type="text" required placeholder="+251 9XX XXX XXX" id="loginId">
          </div>
          <div class="form-group">
            <label>
              <span class="lang-om">Jecha iccitii</span>
              <span class="lang-en">Password</span>
            </label>
            <input type="password" required placeholder="••••••••" id="loginPass">
          </div>
          <div class="form-row-between">
            <label>
              <input type="checkbox">
              <span class="lang-om">Na yaadadhu</span>
              <span class="lang-en">Remember me</span>
            </label>
            <a href="#">
              <span class="lang-om">Jecha iccitii dagattee?</span>
              <span class="lang-en">Forgot password?</span>
            </a>
          </div>
          <button type="submit" class="btn-auth">
            <span class="lang-om">Seeni</span>
            <span class="lang-en">Log In</span>
          </button>
        </form>

        <div class="auth-divider">
          <span class="lang-om">ykn</span>
          <span class="lang-en">or</span>
        </div>

        <div class="auth-footer">
          <span class="lang-om">Account hin qabduu?</span>
          <span class="lang-en">Don't have an account?</span>
          <a href="register.html">
            <span class="lang-om">Galmaa'i</span>
            <span class="lang-en">Register</span>
          </a>
        </div>
      </div>
      <div class="switch-role">
        <span class="lang-om">Gosa biraa:</span>
        <span class="lang-en">Other roles:</span>
        <a href="../buyer/login.html">Buyer</a> •
        <a href="../admin/login.html">Admin</a>
      </div>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Demo: redirect to farmer dashboard
      window.location.href = 'dashboard.html';
      return false;
    }
  </script>
</body>
</html>
